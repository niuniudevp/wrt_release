name: Build WRT
run-name: Build - ${{ inputs.model }} - ${{ inputs.libwrt_version }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: jdcloud_ipq60xx_libwrt
        options:
          - jdcloud_ipq60xx_libwrt
      libwrt_version:
        required: true
        description: >-
          LibWrt 基版本：latest = 25.12-nss 分支最新代码；或填任意 LibWrt
          release tag 名（如 v25.12.1 / v25.12.2，可省略 v 前缀）；或直接填
          完整 40 位 commit SHA。LibWrt 发布新版本后无需改本文件，直接填
          新 tag 名即可。
        type: string
        default: latest
      extra_luci_packages:
        required: false
        description: >-
          额外编译进固件的软件包，逗号分隔，写完整包名
          （如 luci-app-openclash,luci-app-homeproxy）。留空则使用
          deconfig 文件里已有的包清单。
        default: ""
      add_fragments:
        required: false
        description: >-
          追加配置片段（wrt_core/deconfig/fragments/ 下文件名，逗号分隔）。
          当前仅保留 nss（默认已启用）；如需临时加包请用 extra_luci_packages。
        default: ""
      remove_fragments:
        required: false
        description: Remove default config fragments, comma separated
        default: ""

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo -E apt-get autoremove --purge -y || true
          sudo -E apt-get clean || true
          df -hT

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set Build Date and Timezone
        env:
          RAW_ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          RAW_REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          sanitize_cache_key_part() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '_'; }
          echo "ADD_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_ADD_CONFIG_FRAGMENTS")" >> $GITHUB_ENV
          echo "REMOVE_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_REMOVE_CONFIG_FRAGMENTS")" >> $GITHUB_ENV

      - name: Apply LibWrt Version
        env:
          LIBWRT_VERSION: ${{ inputs.libwrt_version }}
        run: |
          set -e
          INI="wrt_core/compilecfg/jdcloud_ipq60xx_libwrt.ini"
          REPO="https://github.com/LiBwrt/LibWrt.git"
          # 复位为默认分支，再按输入写入锁定提交（pre_clone 会读取此文件）
          sed -i '/^COMMIT_HASH=/d' "$INI"
          sed -i 's|^REPO_BRANCH=.*|REPO_BRANCH=25.12-nss|' "$INI"

          # 解析 tag 对应的 commit：优先 peeled 行（annotated tag），
          # 否则直接取 tag 行（lightweight tag）
          resolve_tag() {
            local tag="$1" sha=""
            sha=$(git ls-remote "$REPO" "refs/tags/${tag}^{}" | awk '{print $1}')
            if [ -z "$sha" ]; then
              sha=$(git ls-remote "$REPO" "refs/tags/${tag}" | awk '{print $1}')
            fi
            echo "$sha"
          }

          case "$LIBWRT_VERSION" in
            latest|"")
              echo "使用分支最新代码（25.12-nss）"
              ;;
            *)
              if [[ "$LIBWRT_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
                echo "使用指定提交：$LIBWRT_VERSION"
                echo "COMMIT_HASH=$LIBWRT_VERSION" >> "$INI"
              else
                SHA=$(resolve_tag "$LIBWRT_VERSION")
                if [ -z "$SHA" ] && [ "${LIBWRT_VERSION:0:1}" != "v" ]; then
                  SHA=$(resolve_tag "v${LIBWRT_VERSION}")
                fi
                if [ -z "$SHA" ]; then
                  echo "错误：在 $REPO 找不到版本/tag：$LIBWRT_VERSION" >&2
                  exit 1
                fi
                echo "版本 $LIBWRT_VERSION -> 提交 $SHA"
                echo "COMMIT_HASH=$SHA" >> "$INI"
              fi
              ;;
          esac
          echo "===== $INI ====="
          cat "$INI"

      - name: Apply Custom LuCI Packages
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_luci_packages }}
        run: |
          if [ -n "$EXTRA_PACKAGES" ]; then
            CFG="wrt_core/deconfig/jdcloud_ipq60xx_libwrt.config"
            echo "" >> "$CFG"
            echo "# Extra packages from workflow input" >> "$CFG"
            IFS=',' read -r -a pkgs <<< "$EXTRA_PACKAGES"
            for p in "${pkgs[@]}"; do
              p="${p//[[:space:]]/}"
              [ -z "$p" ] && continue
              echo "CONFIG_PACKAGE_${p}=y" >> "$CFG"
            done
            echo "===== 追加的软件包 ====="
            grep -E "^CONFIG_PACKAGE_" "$CFG" | tail -30
          else
            echo "未指定额外软件包，使用 deconfig 默认清单。"
          fi

      - name: Pre Clone
        run: ./wrt_core/pre_clone_action.sh ${{ inputs.model }}

      - name: Cache Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ inputs.model }}-${{ inputs.libwrt_version }}-${{ hashFiles('**/repo_flag') }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ inputs.model }}-${{ inputs.libwrt_version }}-${{ hashFiles('**/repo_flag') }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-
            ${{ matrix.os }}-${{ inputs.model }}-${{ inputs.libwrt_version }}-${{ hashFiles('**/repo_flag') }}-

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Machine Information (Pre-build)
        run: |
          echo "=============== Pre-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "=================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "=================================================="
          echo "[Memory]"
          free -h
          echo "=================================================="
          echo "[Disk]"
          df -hT
          echo "--------------------------------------------------"
          df -hi
          echo "=================================================="
          echo "[Workspace]"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "=================================================="

      - name: Build Firmware
        env:
          ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: ./build.sh ${{ inputs.model }}

      - name: Package Kmods
        run: |
          if [ ! -d "./action_build/bin" ]; then
            echo "kmod source directory not found: ./action_build/bin" >&2
            exit 1
          fi

          KMOD_LIST=$(mktemp)
          trap 'rm -f "$KMOD_LIST"' EXIT

          (
            cd ./action_build/bin
            find . -type f \( -name "kmod*.ipk" -o -name "kmod*.apk" \) -print | sort > "$KMOD_LIST"
          )

          if [ ! -s "$KMOD_LIST" ]; then
            echo "No kmod packages found under ./action_build/bin" >&2
            exit 1
          fi

          kmod_count=$(wc -l < "$KMOD_LIST" | tr -d '[:space:]')
          archive_name="kmods_${{ inputs.model }}_${{ inputs.libwrt_version }}_${BUILD_DATE}.tar.gz"
          tar -C ./action_build/bin -czf "$archive_name" -T "$KMOD_LIST"

          echo "KMOD_ARCHIVE=$archive_name" >> "$GITHUB_ENV"
          echo "Packaged $kmod_count kmod packages into $archive_name"

      - name: Delete Old Cache
        run: |
          # 获取缓存列表并删除
          gh cache list --key ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          # 输出缓存状态
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: Machine Information (Post-build)
        run: |
          echo "=============== Post-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "===================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "===================================================="
          echo "[Memory]"
          free -h
          echo "===================================================="
          echo "[Disk]"
          df -hT
          echo "----------------------------------------------------"
          df -hi
          echo "===================================================="
          echo "[Build Outputs]"
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "Firmware file count: $(ls -1 ./firmware 2>/dev/null | wc -l)"
          echo "===================================================="

      - name: Upload Firmware
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BUILD_DATE }}_${{ inputs.model }}_${{ inputs.libwrt_version }}
          path: |
            ./firmware/*.*
            ./kmods_*.tar.gz
